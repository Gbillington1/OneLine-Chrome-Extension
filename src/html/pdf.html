<!DOCTYPE html>
<html>

<head>
    <!--- icons -->
    <link rel="stylesheet" href="../css/fontawesome.min.css" />
    <link rel="stylesheet" href="../css/solid.min.css" />

    <!-- css -->
    <link rel="stylesheet" href="../css/tailwind/out.css" />

    <!-- textLayer css -->
    <style>
        .textLayer {
            position: absolute;
            text-align: initial;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            opacity: 0.25;
            line-height: 1;
            -webkit-text-size-adjust: none;
               -moz-text-size-adjust: none;
                    text-size-adjust: none;
            forced-color-adjust: none;
          }
          
          .textLayer span,
          .textLayer br {
            color: transparent;
            position: absolute;
            white-space: pre;
            cursor: text;
            transform-origin: 0% 0%;
          }
          
          /* Only necessary in Google Chrome, see issue 14205, and most unfortunately
           * the problem doesn't show up in "text" reference tests. */
          .textLayer span.markedContent {
            top: 0;
            height: 0;
          }
          
          .textLayer .highlight {
            margin: -1px;
            padding: 1px;
            background-color: rgba(180, 0, 170, 1);
            border-radius: 4px;
          }
          
          .textLayer .highlight.appended {
            position: initial;
          }
          
          .textLayer .highlight.begin {
            border-radius: 4px 0 0 4px;
          }
          
          .textLayer .highlight.end {
            border-radius: 0 4px 4px 0;
          }
          
          .textLayer .highlight.middle {
            border-radius: 0;
          }
          
          .textLayer .highlight.selected {
            background-color: rgba(0, 100, 0, 1);
          }
          
          .textLayer ::-moz-selection {
            background: blue;
            background: AccentColor;
          }
          
          .textLayer ::selection {
            background: blue;
            background: AccentColor;
          }
          
          /* Avoids https://github.com/mozilla/pdf.js/issues/13840 in Chrome */
          .textLayer br::-moz-selection {
            background: transparent;
          }
          .textLayer br::selection {
            background: transparent;
          }
          
          .textLayer .endOfContent {
            display: block;
            position: absolute;
            left: 0;
            top: 100%;
            right: 0;
            bottom: 0;
            z-index: -1;
            cursor: default;
            -webkit-user-select: none;
               -moz-user-select: none;
                    user-select: none;
          }
          
          .textLayer .endOfContent.active {
            top: 0;
          }
    </style>

    <!-- js -->
    <script src="../js/libraries/jquery-3.4.1.min.js"></script>
    <script src="../js/libraries/pdfJS/pdf.js"></script>
    <script src="../js/libraries/pdfJS/pdf.worker.js"></script>
    <script type='module' src='../js/popup/util-functions.js'></script>
</head>

<body class="bg-gray-600">

    <!-- tool bar -->
    <div class="sticky top-0 z-50">
      <div class="h-12 w-screen bg-gray-500 flex space-between border-b-2 border-gray-700">
  
        <!-- left side -->
          <div class="basis-1/3 flex items-center justify-start">

          </div>
  
          <!-- zoom controls -->
          <div class="basis-1/3 flex items-center justify-center">
            <div class="flex flex-row text-white">
              <!-- zoom out -->
              <div>
                <button id="zoom-out" class="h-8 w-8 text-xl bg-gray-700 rounded-l-md flex items-center justify-center border-2 border-gray-900 hover:bg-gray-800">
                  <i class="fa-solid fa-minus text-sm"></i>
                </button>
              </div>
  
              <div class="bg-gray-700 text-white text-md h-8 w-12 border-y-2 border-gray-900 flex items-center justify-center">
                <span id="zoom-value">100%</span>
              </div>
  
              <!-- zoom in -->
              <div>
                <button id="zoom-in" class="h-8 w-8 bg-gray-700 text-white text-xl rounded-r-md flex items-center justify-center border-2 border-gray-900 hover:bg-gray-800">
                  <i class="fa-solid fa-plus text-sm"></i>
                </button>
              </div>
  
            </div>
          </div>
  
          <!-- right side -->
          <div class="basis-1/3 flex items-center justify-end">
          
          </div>
      </div>
    </div>

    <!-- background/container for pdf -->
    <div id="pdfContainer" class="h-full w-screen bg-gray-600">
      <!-- pdf pages appended to this div -->
      <div id="content" class="w-fit m-auto"></div>
    </div>

    <script type="module" src="../js/pdf/pdfController.js"></script>
</body>

</html>
