<!DOCTYPE html>
<html>

<head>
  <script type="module" src="../../dist/colorSettingsPopup.bundle.js"></script>
  <link rel="stylesheet" href="../css/colorOptions.css" />
</head>

<body> 
  <a id="backLink">
    <div id="backContainer">
      <div id='row1'>
          <img id="backToMenu" src="../images/arrow-l.png" />
          <h3 id='backTitle'>Back</h3>
      </div>
    </div>
  </a>
  <div class="optionsWrap">
    <div class="colorGroup" id="recommended">
      <h3 class="settingHeader">Recommended Colors</h3>
      <div class="btnWrapper">
        <button class="recommendedBtn" id="orangeBtn"><img src='../images/eyedropper-b.png' class='colorBtnImg'></button>
        <button class="recommendedBtn" id="peachBtn"><img src='../images/eyedropper-b.png' class='colorBtnImg'></button>
        <button class="recommendedBtn" id="yellowBtn"><img src='../images/eyedropper-b.png' class='colorBtnImg'></button>
      </div>
    </div>
    <!-- <div id="canvasWrapper">
      <canvas width="150" height="150" id="colorPicker"></canvas>
    </div> -->
    <div id="colorPicker"></div>
    <!-- <div id='small'>
      <small id="favErr">Please delete a favorite and try again.</small>
    </div> -->
    <div id="active-color">
      <h3 id='activeColorHeader'>Active Color</h3>
      <button title="Click here to add the active color to favorites." id='addToFavs'><img src='../images/bookmark-b.png'
          class='addToFavsIcon'></button>
    </div>
    <div class="colorGroup" id="favorites">
      <div id="favHead">
        <img src='../images/bookmark-b.png' style="padding-right: 3px;" class='addToFavsIcon'>
        <h3 class="settingHeader">Favorites</h3>
      </div>
      <div id="favoritesContainer">
        <div class="colorBtnWrap">
          <button favoriteIsSet='false' class="favoritesColorBtn" id='favBtn1'><img src='../images/eyedropper-b.png'
              class='colorBtnImg'></button>
          <img class="deleteIcon" src='../images/deleteicon.png'>
        </div>
        <div class="colorBtnWrap">
          <button favoriteIsSet='false' class="favoritesColorBtn" id='favBtn2'><img src='../images/eyedropper-b.png'
              class='colorBtnImg'></button>
          <img class="deleteIcon" src='../images/deleteicon.png'>
        </div>
        <div class="colorBtnWrap">
          <button favoriteIsSet='false' class="favoritesColorBtn" id='favBtn3'><img src='../images/eyedropper-b.png'
              class='colorBtnImg'></button>
          <img class="deleteIcon" src='../images/deleteicon.png'>
        </div>
        <div class="colorBtnWrap">
          <button favoriteIsSet='false' class="favoritesColorBtn" id='favBtn4'><img src='../images/eyedropper-b.png'
              class='colorBtnImg'></button>
          <img class="deleteIcon" src='../images/deleteicon.png'>
        </div>
        <div class="colorBtnWrap">
          <button favoriteIsSet='false' class="favoritesColorBtn" id='favBtn5'><img src='../images/eyedropper-b.png'
              class='colorBtnImg'></button>
          <img class="deleteIcon" src='../images/deleteicon.png'>
        </div>
      </div>
    </div>
  </div>
  
</body>

</html>
