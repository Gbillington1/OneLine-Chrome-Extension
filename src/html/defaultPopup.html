<!DOCTYPE html>
<html>

<head>
    <script type='module' src='../../dist/defaultPopup.bundle.js'></script>
    <link rel='stylesheet' href='../css/defaultStyle.css' />
</head>

<body>
    <!-- OneLine image header -->
    <img id="imgHeader" src="../images/OneLineHeader.png" width="250px" height="84px" />
    <hr />

    <!-- On/Off switch-->

    <div class='switchWrapper'>
        <div class="switchHeaderContainer">
            <h3 id="onOffHeader" class='header'>On/Off</h3>
        </div>
        <div class="switchBodyContainer">
            <input id="onOffSwitch" class="switch" type="checkbox" />
            <label for="onOffSwitch">Toggle</label>
        </div>
    </div>

    <!-- Abionic Reading Switch -->
    <div class='switchWrapper'>
        <div class="switchHeaderContainer">
            <h3 id="onOffHeader" class='header'>Enable Bionic Reading</h3>
        </div>
        <div class="switchBodyContainer">
            <input id="abionicSwitch" class="switch" type="checkbox" />
            <label for="abionicSwitch">Toggle</label>
        </div>
    </div>

    <!-- Tabs linking to other pages -->

    <div id="navigationContainer">
        <div class="tab" id="colorSettings">
            <div class='col1'>
                <img class='icon' src='../images/eyedropper-b.png'>
            </div>
            <div class='col2'>
                <h3 class="title">Color Settings</h3>
            </div>
            <div class='col3'>
                <img class='icon' src="../images/arrow-r.png">
            </div>
        </div>
        <div class="tab" id='emailList'>
            <div class='col1'>
                <img class='icon' src='../images/email.png'>
            </div>
            <div class='col2'>
                <h3 class="title">Join Mailing List</h3>
            </div>
            <div class='col3'>
                <img class='icon' src="../images/arrow-r.png">
            </div>
        </div>
    </div>

</body>

</html>
