<div id="ol-open-pdf-popup" class="absolute top-0 right-0">
    <div class="fixed bottom-12 right-8 z-max">
        <div id="ol-successAlert"
             class="p-4 mb-4 text-green-700 border border-green-300 rounded-lg bg-green-50 w-80 relative shadow-custom">

            <!-- header text -->
            <div class="flex items-center justify-between mb-2">
                <h3 class="text-lg font-medium">Open PDF in OneLine?</h3>
                <!-- X icon for dismissing -->
                <button type="button" id="ol-dismissPDF"
                        class="text-green-700 hover:text-green-900 focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                              d="M14.293 5.293a1 1 0 011.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 011.414-1.414L10 8.586l4.293-4.293a1 1 0 011.414 0z"
                              clip-rule="evenodd"/>
                    </svg>
                </button>
            </div>
            <!-- buttons -->
            <div class="flex flex-col">
                <button type="button" id="ol-openPDF"
                        class="h-10 text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-green-300 text-md rounded-lg px-3 py-1.5">
                    Open PDF
                </button>
            </div>
        </div>
    </div>
</div>
