<div id="ol-open-pdf-popup" class="ole-absolute ole-top-0 ole-right-0">
    <div class="ole-fixed ole-bottom-12 ole-right-8 ole-z-max">
        <div id="ol-successAlert"
             class="ole-p-4 ole-mb-4 ole-text-green-700 ole-border ole-border-green-300 ole-rounded-lg ole-bg-green-50 ole-w-80 ole-relative ole-shadow-custom">

            <!-- header text -->
            <div class="ole-flex ole-items-center ole-justify-between ole-mb-2">
                <h3 class="ole-text-lg ole-font-medium">Open PDF in OneLine?</h3>
                <!-- X icon for dismissing -->
                <button type="button" id="ol-dismissPDF"
                        class="ole-text-green-700 hover:ole-text-green-900 focus:ole-outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                              d="M14.293 5.293a1 1 0 011.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 011.414-1.414L10 8.586l4.293-4.293a1 1 0 011.414 0z"
                              clip-rule="evenodd"/>
                    </svg>
                </button>
            </div>
            <!-- buttons -->
            <div class="ole-flex ole-flex-col">
                <button type="button" id="ol-openPDF"
                        class="ole-h-10 ole-text-white ole-bg-green-700 hover:ole-bg-green-800 focus:ole-ring-4 focus:ole-outline-none focus:ole-ring-green-300 ole-text-md ole-rounded-lg ole-px-3 ole-py-1.5">
                    Open PDF
                </button>
            </div>
        </div>
    </div>
</div>
