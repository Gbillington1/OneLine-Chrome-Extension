<div id="oneline-pdf-coming-soon" class="absolute top-0 right-0">
    <div class="fixed bottom-12 right-8 z-max">
        <div id="ol-successAlert" class="p-4 mb-4 text-green-700 border border-green-300 rounded-lg bg-green-50 w-80"
            role="alert">
            <!-- header text -->
            <div class="flex items-center">
                <svg aria-hidden="true" class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd"
                        d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                        clip-rule="evenodd"></path>
                </svg> 
                <span class="sr-only">Info</span>
                <h3 class="text-lg font-medium">PDF support coming soon...</h3>
            </div>
            <!-- additional text -->
            <div class="mt-2 mb-4 text-sm">
                OneLine PDF support is coming soon! To be notified when new features become available, join our
                mailing list.
            </div>

            <!-- buttons -->
            <div class="flex items-center">
                <button type="button" id="ol-signUp"
                    class="text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-lg text-xs px-3 py-1.5 mr-2 text-center inline-flex items-center">
                    Sign me up!
                </button>
                <button type="button" id="ol-dismiss"
                    class="text-green-700 bg-transparent border border-green-700 hover:bg-green-800 hover:text-white focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-lg text-xs px-3 py-1.5 text-center"
                    data-dismiss-target="#successAlert" aria-label="Close">
                    Dismiss
                </button>
            </div>
            <button id="ol-dismiss-forever" class="text-[8px] underline">Don't show this again.</button>
        </div>
    </div>
</div>
