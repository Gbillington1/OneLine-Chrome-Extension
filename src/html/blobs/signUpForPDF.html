<div id="ol-sign-up-for" class="absolute top-0 right-0">
    <div class="fixed bottom-12 right-8 z-max">
        <div id="ol-successAlert" class="p-4 mb-4 text-green-700 border border-green-300 rounded-lg bg-green-50 w-96 shadow-custom"
            role="alert">
            <!-- header text -->
            <div class="flex items-center justify-between">
                <span class="text-lg font-medium">Sign up to open this PDF in OneLine</span>
                <!-- close button -->
                <button type="button" id="ol-close-btn" class="p-2 text-gray-400 rounded-full hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                    <span class="sr-only">Close</span>
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <!-- additional text -->
            <div class="mt-2 mb-4 text-sm">
                OneLine now supports PDFs, but you must create an account or sign in to an existing account. Don't worry, its free!
            </div>

            <!-- buttons -->
            <div class="flex items-center text-center">
                <button type="button" id="ol-signUp"
                    class="basis-1/2 text-white bg-green-700 border border-green-700 hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-lg text-xs px-3 py-2 mr-2 text-center transition duration-100">
                    Sign Up
                </button>
                <button type="button" id="ol-login"
                    class="basis-1/2 text-green-700 bg-transparent border border-green-700 hover:bg-green-800 hover:text-white focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-lg text-xs px-3 py-2 text-center transition duration-100"
                    data-dismiss-target="#successAlert" aria-label="Close">
                    Login
                </button>
            </div>
        </div>
    </div>
</div>
