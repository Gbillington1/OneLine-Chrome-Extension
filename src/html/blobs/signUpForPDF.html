<div id="ol-sign-up-for" class="ole-absolute ole-top-0 ole-right-0">
    <div class="ole-fixed ole-bottom-12 ole-right-8 ole-z-max">

            <div class="ole-flex ole-items-center ole-justify-between">

                <!-- close button -->
                <button type="button" id="ol-close-btn" class="ole-p-2 ole-bg-transparent ole-border-none ole-text-gray-400 ole-rounded-full hover:ole-text-gray-500 hover:ole-bg-transparent hover:ole-border-none focus:ole-outline-none focus:ole-ring-2 focus:ole-ring-offset-2 focus:ole-ring-green-500">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />

            </div>
        </div>
    </div>
