<div id="ol-pdf-sign-up" class="absolute top-0 right-0">

    <aside
        class="fixed bottom-12 right-8 z-max p-6 text-green-700 bg-green-50 border border-green-300 rounded-lg shadow-md w-96"
        aria-label="Subscribe to the OneLine newsletter">

        <h3 class="mb-3 text-xl font-medium">Updates coming soon...</h3>
        <p class="mb-5 text-sm font-medium">Do you want to get notified when a new
            features are added to OneLine? Sign up for our newsletter and you'll be among the first to find out about new
            updates.</p>

        <form action="http://127.0.0.1/api/collect" class="" method="post"
            min-width="400 500 600 700">
            <div data-style="clean" class="flex items-end">

                <div data-element="fields" data-stacked="false"
                    class="flex items-center w-full max-w-md">

                    <!-- email input -->
                    <div class="relative w-full mr-3">
                        <label for="member_email"
                            class="hidden block mb-2 text-sm font-medium">Email
                            address</label>
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                            <svg class="w-4 h-4 text-gray-500" fill="currentColor"
                                viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path>
                                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path>
                            </svg>
                        </div>
                        <input id="email"
                            class="bg-gray-50 border border-gray-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 p-2.5"
                            name="email" aria-label="Email Address" placeholder="Your email address..."
                            required="" type="email">
                    </div>

                    <!-- subscribe button -->
                    <button type="submit" id="ol-signUp">
                        <span
                            class="px-5 py-3 text-sm font-medium text-center text-white bg-green-700 rounded-lg cursor-pointer hover:bg-green-800 focus:ring-4 focus:ring-green-300">Subscribe</span>
                    </button>
                </div>

            </div>
        </form>
    </aside>
</div>
