<!DOCTYPE html>
<html>

<head>
    <link rel='stylesheet' href='../css/tailwind/out.css' />
    <link rel='stylesheet' href='../css/defaultStyle.css' />
</head>

<body class="font-sans tracking-tight">
    <div class="w-[300px] bg-ol-offwhite p-4 flex flex-col">
        <!-- Logo/Header -->
        <div>
            <h1 class="text-2xl text-ol-black font-bold">
                OneLine <span class="text-ol-green">for Chrome</span>
            </h1>
        </div>

        <!-- content of sign up blocker -->
        <div>
            <!-- header & description text -->
            <div class="mt-3 left sm:mt-5">
                <h3 class="text-lg font-semibold leading-6 text-black">Connect to Your Account</h3>
                <div class="mt-2">
                    <p class="text-base text-ol-darkgray">
                        OneLine is active in your browser, but you must create an account, or log into an existing account to get access to its features.
                    </p>
                </div>
            </div>
            <!-- button to login screen-->
            <div class="flex justify-between items-center space-x-4">
                <div class="basis-1/2 mt-5 sm:mt-6">
                    <button id="signUpBtn" type="button" class="inline-flex w-full justify-center rounded-md bg-ol-green px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-ol-green-dark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ol-green transition duration-100">Sign Up</button>
                </div>
                <div class="basis-1/2 mt-5 sm:mt-6">
                    <button id="loginBtn" type="button" class="inline-flex w-full justify-center rounded-md bg-ol-green px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-ol-green-dark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ol-green transition duration-100">Log In</button>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
