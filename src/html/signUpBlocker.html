<!DOCTYPE html>
<html>

<head>
    <link rel='stylesheet' href='../css/tailwind/ole-out.css' />
</head>

<body class="ole-font-sans ole-tracking-tight">
    <div class="ole-w-[300px] ole-bg-ol-offwhite ole-p-4 ole-flex ole-flex-col">
        <!-- Logo/Header -->
        <div>
            <h1 class="ole-text-2xl ole-text-ol-black ole-font-bold">
                OneLine <span class="ole-text-ol-green">for Chrome</span>
            </h1>
        </div>

        <!-- content of sign up blocker -->
        <div>
            <!-- header & description text -->
            <div class="ole-mt-3 ole-left sm:ole-mt-5">
                <h3 class="ole-text-lg ole-font-semibold ole-leading-6 ole-text-black">Connect to Your Account</h3>
                <div class="ole-mt-2">
                    <p class="ole-text-base ole-text-ol-darkgray">
                        OneLine is active in your browser, but you must create an account, or log into an existing account to get access to its features.
                    </p>
                </div>
            </div>
            <!-- button to login screen-->
            <div class="ole-flex ole-justify-between ole-items-center ole-space-x-4">
                <div class="ole-basis-1/2 ole-mt-5 sm:ole-mt-6">
                    <button id="signUpBtn" type="button" class="ole-inline-flex ole-w-full ole-justify-center ole-rounded-md ole-bg-ol-green ole-px-3 ole-py-2 ole-text-sm ole-font-semibold ole-text-white ole-shadow-sm hover:ole-bg-ol-green-dark focus-visible:ole-outline focus-visible:ole-outline-2 focus-visible:ole-outline-offset-2 focus-visible:ole-outline-ol-green ole-transition ole-duration-100">Sign Up</button>
                </div>
                <div class="ole-basis-1/2 ole-mt-5 sm:ole-mt-6">
                    <button id="loginBtn" type="button" class="ole-inline-flex ole-w-full ole-justify-center ole-rounded-md ole-bg-ol-green ole-px-3 ole-py-2 ole-text-sm ole-font-semibold ole-text-white ole-shadow-sm hover:ole-bg-ol-green-dark focus-visible:ole-outline focus-visible:ole-outline-2 focus-visible:ole-outline-offset-2 focus-visible:ole-outline-ol-green ole-transition ole-duration-100">Log In</button>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
