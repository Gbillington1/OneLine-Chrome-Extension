<div id="ol-reload-page-prompt" class="absolute top-0 right-0">
    <aside
    class="fixed top-12 left-1/2 -translate-x-1/2 z-max p-6 text-green-700 bg-green-50 border border-green-300 rounded-lg shadow-md w-96">
        <h3 class="mb-3 text-xl font-medium">Reload pages?</h3>
        <p class="mb-5 text-sm font-medium">For OneLine to work right away, every tab in Chrome must be reloaded. Should OneLine reload all of your tabs for you right now?</p>
        <button type="button" id="ol-reload-btn" class="px-5 py-3 w-full text-sm font-medium text-center text-white !bg-green-700 rounded-lg cursor-pointer hover:!bg-green-800 focus:ring-4 focus:ring-green-300 transition">Reload all tabs</button>
        <!-- close button -->
        <button type="button" id="ol-close-btn" class="absolute top-2 right-2 p-2 text-gray-400 rounded-full hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
            <span class="sr-only">Close</span>
            <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
    </aside>
</div>
